name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare release signing
        env:
          KEYSTORE: ${{ secrets.DIARY_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DIARY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.DIARY_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/diary.jks"
            echo "DIARY_KEYSTORE=$RUNNER_TEMP/diary.jks" >> "$GITHUB_ENV"
            echo "DIARY_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "DIARY_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo 'Release signing secrets are required for a published APK.'
            exit 1
          fi
      - name: Build and lint
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease lintDebug --no-daemon
          cp app/build/outputs/apk/release/app-release.apk Diary.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Diary-APK
          path: Diary.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lint-report
          path: app/build/reports/lint-results-debug.html

  test:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: Nexus 5
          disable-animations: true
          script: chmod +x gradlew && ./gradlew connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-report
          path: app/build/reports/androidTests/connected/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Diary-APK
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" Diary.apk --title "Дневник $GITHUB_REF_NAME" --notes 'Простой учебный дневник. Вход: student / 123456. Android 5.0 и выше. Данные хранятся в SQLite на устройстве.'
